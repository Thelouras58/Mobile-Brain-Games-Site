{% assign native_platforms = page.platforms | where_exp: "platform", "platform.id != 'web'" %}
{% assign web_platform = page.platforms | where: 'id', 'web' | first %}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@graph": [
    {
      "@type": "Organization",
      "@id": {{ site.url | append: '/#organization' | jsonify }},
      "name": {{ site.title | jsonify }},
      "url": {{ site.url | append: '/' | jsonify }},
      "logo": {{ site.social_image | absolute_url | jsonify }},
      "sameAs": [{% for network in site.social %}{{ network.url | jsonify }}{% unless forloop.last %},{% endunless %}{% endfor %}]
    },
    {
      "@type": "WebSite",
      "@id": {{ site.url | append: '/#website' | jsonify }},
      "name": {{ site.title | jsonify }},
      "url": {{ site.url | append: '/' | jsonify }},
      "publisher": {"@id": {{ site.url | append: '/#organization' | jsonify }}}
    },
    {
      "@type": {% if page.url == '/blog/' or page.url == '/games/' %}"CollectionPage"{% elsif page.layout == 'blog' %}"BlogPosting"{% elsif page.download %}"SoftwareApplication"{% else %}"WebPage"{% endif %},
      "@id": {{ page.url | absolute_url | append: '#main' | jsonify }},
      "url": {{ page.url | absolute_url | jsonify }},
      {% if page.layout == 'blog' and page.url != '/blog/' %}
      "headline": {{ page.title | jsonify }},
      "datePublished": {{ page.date | date_to_xmlschema | jsonify }},
      "dateModified": {{ page.last_modified_at | default: page.date | date_to_xmlschema | jsonify }},
      "author": {"@id": {{ site.url | append: '/#organization' | jsonify }}},
      "publisher": {"@id": {{ site.url | append: '/#organization' | jsonify }}},
      "image": {{ page.social_image | default: site.social_image | absolute_url | jsonify }},
      {% elsif page.download %}
      "name": {{ page.app_name | jsonify }},
      "alternateName": {% if native_platforms and native_platforms.size > 0 %}[{% for platform in native_platforms %}{{ platform.name | jsonify }}{% unless forloop.last %},{% endunless %}{% endfor %}]{% else %}{{ page.store_name | default: page.app_name | jsonify }}{% endif %},
      "applicationCategory": {{ page.schema_category | default: 'GameApplication' | jsonify }},
      "operatingSystem": {% if native_platforms and native_platforms.size > 0 %}[{% for platform in native_platforms %}{% if platform.id == 'android' %}"Android"{% elsif platform.id == 'ios' %}"iOS"{% else %}{{ platform.id | jsonify }}{% endif %}{% unless forloop.last %},{% endunless %}{% endfor %}]{% elsif page.ios_download %}["Android", "iOS"]{% else %}"Android"{% endif %},
      "downloadUrl": {% if native_platforms and native_platforms.size > 0 %}[{% for platform in native_platforms %}{{ platform.url | jsonify }}{% unless forloop.last %},{% endunless %}{% endfor %}]{% else %}{{ page.download | jsonify }}{% endif %},
      "publisher": {"@id": {{ site.url | append: '/#organization' | jsonify }}},
      "image": {{ page.social_image | default: site.social_image | absolute_url | jsonify }},
      {% if page.offer_price != nil %}
      "offers": {% if native_platforms and native_platforms.size > 0 %}[{% for platform in native_platforms %}{"@type": "Offer", "price": {{ page.offer_price | jsonify }}, "url": {{ platform.url | jsonify }}}{% unless forloop.last %},{% endunless %}{% endfor %}]{% else %}{"@type": "Offer", "price": {{ page.offer_price | jsonify }}, "url": {{ page.download | jsonify }}}{% endif %},
      {% endif %}
      {% else %}
      "name": {{ page.title | default: site.title | jsonify }},
      {% endif %}
      "description": {{ page.description | default: site.description | jsonify }},
      "isPartOf": {"@id": {{ site.url | append: '/#website' | jsonify }}}
    }{% if web_platform %},
    {
      "@type": "WebApplication",
      "@id": {{ web_platform.url | absolute_url | append: '#web-app' | jsonify }},
      "name": {{ web_platform.name | jsonify }},
      "url": {{ web_platform.url | absolute_url | jsonify }},
      "description": {{ web_platform.name | append: ' browser game.' | jsonify }},
      "applicationCategory": "GameApplication",
      "operatingSystem": "Web browser",
      "browserRequirements": "Requires JavaScript",
      "publisher": {"@id": {{ site.url | append: '/#organization' | jsonify }}},
      "isPartOf": {"@id": {{ site.url | append: '/#website' | jsonify }}}
    }{% endif %}{% unless page.url == '/' %},
    {
      "@type": "BreadcrumbList",
      "@id": {{ page.url | absolute_url | append: '#breadcrumb' | jsonify }},
      "itemListElement": [
        {"@type": "ListItem", "position": 1, "name": "Home", "item": {{ site.url | append: '/' | jsonify }}}{% if page.layout == 'blog' or page.url == '/blog/' %},
        {"@type": "ListItem", "position": 2, "name": "Blog", "item": {{ '/blog/' | absolute_url | jsonify }}}{% if page.layout == 'blog' and page.url != '/blog/' %},
        {"@type": "ListItem", "position": 3, "name": {{ page.title | jsonify }}, "item": {{ page.url | absolute_url | jsonify }}}{% endif %}{% elsif page.download or page.url == '/games/' %},
        {"@type": "ListItem", "position": 2, "name": "Games", "item": {{ '/games/' | absolute_url | jsonify }}}{% if page.download %},
        {"@type": "ListItem", "position": 3, "name": {{ page.app_name | jsonify }}, "item": {{ page.url | absolute_url | jsonify }}}{% endif %}{% else %},
        {"@type": "ListItem", "position": 2, "name": {{ page.title | jsonify }}, "item": {{ page.url | absolute_url | jsonify }}}{% endif %}
      ]
    }{% endunless %}
  ]
}
</script>

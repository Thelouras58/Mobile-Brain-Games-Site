{% if page.download %}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "SoftwareApplication",
  "name": {{ page.app_name | jsonify }},
  "applicationCategory": "GameApplication",
  "operatingSystem": "Android",
  "url": {{ page.url | absolute_url | jsonify }},
  "downloadUrl": {{ page.download | jsonify }},
  "description": {{ page.description | jsonify }},
  "image": {{ page.social_image | default: site.social_image | absolute_url | jsonify }}
}
</script>
{% elsif page.url == '/blog/' %}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "CollectionPage",
  "name": {{ page.title | jsonify }},
  "description": {{ page.description | jsonify }},
  "url": {{ page.url | absolute_url | jsonify }},
  "isPartOf": {"@type": "WebSite", "name": {{ site.title | jsonify }}, "url": {{ site.url | jsonify }}}
}
</script>
{% elsif page.layout == 'blog' %}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "BlogPosting",
  "headline": {{ page.title | jsonify }},
  "description": {{ page.description | jsonify }},
  "image": {{ page.social_image | default: site.social_image | absolute_url | jsonify }},
  "url": {{ page.url | absolute_url | jsonify }},
  "datePublished": {{ page.date | date_to_xmlschema | jsonify }}{% if page.date_modified %},
  "dateModified": {{ page.date_modified | date_to_xmlschema | jsonify }}{% endif %},
  "author": {"@type": "Organization", "name": {{ site.title | jsonify }}},
  "publisher": {"@type": "Organization", "name": {{ site.title | jsonify }}, "logo": {"@type": "ImageObject", "url": {{ site.social_image | absolute_url | jsonify }}}
}
</script>
{% elsif page.url == '/' %}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Organization",
  "name": {{ site.title | jsonify }},
  "url": {{ site.url | jsonify }},
  "logo": {{ site.social_image | absolute_url | jsonify }},
  "sameAs": [{% for network in site.social %}{{ network.url | jsonify }}{% unless forloop.last %},{% endunless %}{% endfor %}]
}
</script>
{% endif %}

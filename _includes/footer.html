<footer class="site-footer">
  <div class="content-width">
    <p class="site-footer__brand">{{ site.title }}</p>
    <p>Free Android puzzle, memory, word, maths, and reaction games.</p>
    <p><a href="mailto:{{ site.email }}">{{ site.email }}</a></p>
    <nav aria-label="Social profiles">
      {% for network in site.social %}
      <a href="{{ network.url }}" rel="me noopener noreferrer" target="_blank">{{ network.title | capitalize }}</a>{% unless forloop.last %} <span aria-hidden="true">·</span> {% endunless %}
      {% endfor %}
    </nav>
    <p class="site-footer__legal">Copyright © {{ site.footer.copyright }}</p>
  </div>
</footer>

<section class="section" id="games" aria-labelledby="games-heading">
  <div class="content-width">
    <p class="eyebrow">Game collection</p>
    <h2 id="games-heading">Find a game for your next break</h2>
    <p class="section-intro">Each game has its own page with a clear overview, helpful details, and a direct Google Play link.</p>
    <div class="game-grid">
      {% for post in site.posts %}
      <article class="game-card">
        <a href="{{ post.url | relative_url }}" aria-label="Learn about {{ post.app_name }}">
          <img src="{{ '/img/portfolio/' | append: post.img | relative_url }}" alt="{{ post.alt }}" loading="lazy" decoding="async" width="640" height="640">
          <div class="game-card__content">
            <h3>{{ post.app_name }}</h3>
            <p>{{ post.card_description }}</p>
            <span>Explore {{ post.app_name }} <span aria-hidden="true">→</span></span>
          </div>
        </a>
      </article>
      {% endfor %}
    </div>
  </div>
</section>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" role="img" aria-labelledby="title desc">
  <title id="title">Illustrative four-point pattern route</title><desc id="desc">Four numbered dots form a square. Arrows connect point 1 at top left to point 2 at top right, then point 3 at bottom right, then point 4 at bottom left.</desc>
  <rect width="560" height="360" rx="24" fill="#f5f7fa"/><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0 0L8 3L0 6z" fill="#2b6f97"/></marker></defs><path d="M155 105H390M410 125V235M385 255H150" fill="none" stroke="#2b6f97" stroke-width="10" stroke-linecap="round" marker-mid="url(#arrow)" marker-end="url(#arrow)"/><g fill="#172331"><circle cx="135" cy="105" r="25"/><circle cx="410" cy="105" r="25"/><circle cx="410" cy="255" r="25"/><circle cx="135" cy="255" r="25"/></g><g fill="#fff" font-family="system-ui,sans-serif" font-size="20" font-weight="700" text-anchor="middle" dominant-baseline="central"><text x="135" y="105">1</text><text x="410" y="105">2</text><text x="410" y="255">3</text><text x="135" y="255">4</text></g>
</svg>

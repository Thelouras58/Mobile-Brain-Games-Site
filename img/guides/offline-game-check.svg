<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" role="img" aria-labelledby="title desc">
  <title id="title">Illustrative offline game check</title><desc id="desc">A three-step flow: install or load the game, disconnect the test device, then check gameplay and connected features separately.</desc>
  <rect width="720" height="280" rx="24" fill="#f5f7fa"/><g font-family="system-ui,sans-serif" text-anchor="middle"><g fill="#fff" stroke="#506174" stroke-width="3"><rect x="30" y="50" width="190" height="180" rx="16"/><rect x="265" y="50" width="190" height="180" rx="16"/><rect x="500" y="50" width="190" height="180" rx="16"/></g><g fill="#172331"><text x="125" y="100" font-size="28" font-weight="700">1</text><text x="125" y="142" font-size="18">Install or load</text><text x="125" y="170" font-size="18">while connected</text><text x="360" y="100" font-size="28" font-weight="700">2</text><text x="360" y="142" font-size="18">Disconnect</text><text x="360" y="170" font-size="18">the test device</text><text x="595" y="100" font-size="28" font-weight="700">3</text><text x="595" y="142" font-size="18">Check gameplay</text><text x="595" y="170" font-size="18">and extra features</text></g><g fill="#2b6f97" font-size="34"><text x="242" y="148">→</text><text x="477" y="148">→</text></g></g>
</svg>

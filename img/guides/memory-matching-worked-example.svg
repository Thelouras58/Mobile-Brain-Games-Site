<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 410" role="img" aria-labelledby="title desc">
  <title id="title">Illustrative memory matching board with remembered cards</title><desc id="desc">A three by four card grid. Two moons form a known pair. A leaf and a star have been seen but do not match. The remaining cards are face down.</desc>
  <rect width="720" height="410" rx="24" fill="#f5f7fa"/><g font-family="system-ui,sans-serif" text-anchor="middle"><g fill="#fff" stroke="#506174" stroke-width="3"><rect x="45" y="40" width="130" height="90" rx="12"/><rect x="210" y="40" width="130" height="90" rx="12"/><rect x="375" y="40" width="130" height="90" rx="12"/><rect x="540" y="40" width="130" height="90" rx="12"/><rect x="45" y="160" width="130" height="90" rx="12"/><rect x="210" y="160" width="130" height="90" rx="12"/><rect x="375" y="160" width="130" height="90" rx="12"/><rect x="540" y="160" width="130" height="90" rx="12"/><rect x="45" y="280" width="130" height="90" rx="12"/><rect x="210" y="280" width="130" height="90" rx="12"/><rect x="375" y="280" width="130" height="90" rx="12"/><rect x="540" y="280" width="130" height="90" rx="12"/></g><g fill="#dceeff"><rect x="45" y="40" width="130" height="90" rx="12"/><rect x="540" y="280" width="130" height="90" rx="12"/></g><g fill="#172331" font-size="30" font-weight="700"><text x="110" y="98">MOON</text><text x="275" y="98">?</text><text x="440" y="98">LEAF</text><text x="605" y="98">?</text><text x="110" y="218">?</text><text x="275" y="218">STAR</text><text x="440" y="218">?</text><text x="605" y="218">?</text><text x="110" y="338">?</text><text x="275" y="338">?</text><text x="440" y="338">?</text><text x="605" y="338">MOON</text></g></g>
</svg>
